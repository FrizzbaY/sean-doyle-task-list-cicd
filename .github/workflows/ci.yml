name: CI

on:
  push:
    branches: [main]   # run after every merge into main
  pull_request:        # run on every pull request, before it is merged

permissions:
  contents: read       # the workflow can read your code but not change it

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub creates a new Linux machine for each run
    steps:
      - name: Download the repository   # "name" is only a label shown in the run log
        uses: actions/checkout@v7   # copies your code onto the empty machine

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packages
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest --verbose   # runs all tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packages
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .   # any finding fails the job

  code-security:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packages
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Bandit
        run: python -m bandit --recursive . --severity-level medium --exclude ./.venv   # medium or high findings fail the job

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Scan packages for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0, pinned to a commit ID
        with:
          version: v0.74.0                     # the Trivy version to run, never "latest"
          scan-type: fs                        # scan the files in the repository
          scan-ref: .                          # start in the repository's main folder
          scanners: vuln                       # check packages for known vulnerabilities only
          severity: HIGH,CRITICAL              # only these severities count
          exit-code: "1"                       # fail the job if anything is found

  docker-build:
    needs: [test, lint, code-security, dependency-scan] # wait for these jobs, skipped if any fail
    runs-on: ubuntu-latest
    permissions:
      contents: read # repeated here because job permissions replace the workflow-level ones
      id-token: write # allows the job to request OIDC token from GitHub
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build --tag task-list:ci .   # fails the job if the Dockerfile does not build

      - name: Scan the Docker image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0, pinned to a commit ID
        with:
          version: v0.74.0                     # the Trivy version to run, never "latest"
          scan-type: image                     # scan a built Docker image
          image-ref: task-list:ci              # must match the --tag used in the build step
          scanners: vuln                       # check packages for known vulnerabilities only
          severity: HIGH,CRITICAL              # only these severities count
          exit-code: "1"                       # fail the job if anything is found
          ignore-unfixed: true                 # only fail on vulnerabilities that have a fix available

      - name: Start the container
        run: docker run --detach --name task-list-smoke --publish 127.0.0.1:8000:8000 task-list:ci   # run in the background, same port mapping as Compose

      - name: Check that the home page loads
        run: curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/   # retry for up to about 10 seconds while the app starts

      - name: Sign in to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # main only, never on pull requests
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: arn:aws:iam::412341941075:role/task-list-github-actions
          aws-region: eu-north-1

      - name: Sign in to ECR
        id: login-ecr   # "id" lets the next step read this step's output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783

      - name: Tag and push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}   # 412341941075.dkr.ecr.eu-north-1.amazonaws.com
        run: |
          docker tag task-list:ci "${REGISTRY}/task-list:${GITHUB_SHA}"
          docker push "${REGISTRY}/task-list:${GITHUB_SHA}"
          
  deploy:
    needs: [docker-build]   # runs only after the image is built and pushed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # main only, never on pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: i-0edec6c82f35f202b   # from the Terraform output instance_id
    steps:
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: arn:aws:iam::412341941075:role/task-list-github-actions
          aws-region: eu-north-1

      - name: Deploy to the instance
        run: |
          cat > deploy.sh <<'SCRIPT'
          set -eu
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          workdir=$(mktemp --directory)
          curl --fail --silent --show-error --location --output "$workdir/repository.tar.gz" "https://github.com/${REPOSITORY}/archive/${COMMIT}.tar.gz"
          tar --extract --gzip --file "$workdir/repository.tar.gz" --directory "$workdir" --strip-components=1
          sed --in-place "s/:IMAGE_TAG/:${COMMIT}/" "$workdir/k8s/deployment.yaml"
          /usr/local/bin/kubectl apply --filename "$workdir/k8s/"
          /usr/local/bin/kubectl rollout status deployment/task-list --timeout=80s
          SCRIPT

          # The first two lines set the variables the script uses on the instance
          jq --null-input --rawfile body deploy.sh \
            --arg commit "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '{commands: ["COMMIT=" + $commit, "REPOSITORY=" + $repository, $body]}' > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://parameters.json \
            --query Command.CommandId \
            --output text)

          # Waits up to about 100 seconds for the script to finish; prints its output if it fails
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text
            exit 1
          fi