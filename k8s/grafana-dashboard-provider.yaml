# k8s/grafana-dashboard-provider.yaml
# Tells Grafana to load dashboard files from a folder
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: task-list
        type: file
        disableDeletion: true   # the dashboard cannot be deleted in the Grafana page
        allowUiUpdates: false   # changes must be made in the repository
        updateIntervalSeconds: 30   # how often Grafana checks the folder for changes
        options:
          path: /etc/grafana/dashboards   # folder the dashboard file is mounted in
