
# k8s/grafana-dashboard.yaml
# The task list dashboard. Panels without a data source use the default one (Prometheus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  task-list.json: |
    {
      "uid": "task-list",
      "title": "Task list",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "App up",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 4 },
          "targets": [ { "refId": "A", "expr": "up{job=\"task-list\"}" } ],
          "fieldConfig": {
            "defaults": {
              "mappings": [ { "type": "value", "options": {
                "0": { "text": "DOWN", "color": "red" },
                "1": { "text": "UP", "color": "green" } } } ]
            },
            "overrides": []
          }
        },
        {
          "id": 2, "type": "stat", "title": "Tasks added (selected time range)",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 4 },
          "targets": [ { "refId": "A", "expr": "sum(increase(tasks_added_total[$__range]))" } ],
          "fieldConfig": { "defaults": { "decimals": 0 }, "overrides": [] }
        },
        {
          "id": 3, "type": "stat", "title": "Server errors in 5 minutes",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 4 },
          "targets": [ { "refId": "A", "expr": "sum(increase(http_requests_total{status=~\"5..\"}[5m])) or vector(0)" } ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 } ] }
            },
            "overrides": []
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 4, "type": "timeseries", "title": "Requests per second by status",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [ { "refId": "A", "expr": "sum by (status) (rate(http_requests_total[1m]))", "legendFormat": "{{status}}" } ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 5, "type": "timeseries", "title": "95th percentile request duration",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [ { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))" } ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        }
      ]
    }
